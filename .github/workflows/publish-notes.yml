name: Publish notes to Astro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/notes/*.tex'
      - '**/notes/*.pdf'
      - 'publish/notes.json'
      - 'publish/assets/**'
      - 'scripts/*.py'
      - 'tests/**'
      - '.github/workflows/publish-notes.yml'

permissions:
  contents: read

concurrency:
  group: astro-notes
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Pandoc
        run: |
          curl --fail --location --retry 3 \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-1-amd64.deb \
            --output "$RUNNER_TEMP/pandoc.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
      - name: Validate and preview
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/publish_notes.py --export-astro build/astro
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare private Astro source
        env:
          ASTRO_SSH_HOST: ${{ secrets.ASTRO_SSH_HOST }}
          ASTRO_SSH_USER: ${{ secrets.ASTRO_SSH_USER }}
          ASTRO_SSH_PRIVATE_KEY: ${{ secrets.ASTRO_SSH_PRIVATE_KEY }}
          ASTRO_SSH_KNOWN_HOSTS: ${{ secrets.ASTRO_SSH_KNOWN_HOSTS }}
        run: python3 scripts/deploy_astro.py prepare
      - name: Build Astro and search index
        working-directory: build/astro-site
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Publish configured notes
        env:
          ASTRO_SSH_HOST: ${{ secrets.ASTRO_SSH_HOST }}
          ASTRO_SSH_USER: ${{ secrets.ASTRO_SSH_USER }}
          ASTRO_SSH_PRIVATE_KEY: ${{ secrets.ASTRO_SSH_PRIVATE_KEY }}
          ASTRO_SSH_KNOWN_HOSTS: ${{ secrets.ASTRO_SSH_KNOWN_HOSTS }}
        run: python3 scripts/deploy_astro.py publish
